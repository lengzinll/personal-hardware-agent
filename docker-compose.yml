services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aura-agent-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-ornith-1.5:9b}
      - DB_PATH=${DB_PATH:-/app/data/agent.sqlite}
      - GPIO_CHIP=${GPIO_CHIP:-/dev/gpiochip0}
      - RED_PIN=${RED_PIN:-11}
      - YELLOW_PIN=${YELLOW_PIN:-15}
      - GREEN_PIN=${GREEN_PIN:-16}
      - LAMP_PIN=${LAMP_PIN:-13}
      - LAMP_ACTIVE_LOW=${LAMP_ACTIVE_LOW:-true}
    volumes:
      - backend-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # To enable hardware GPIO access on Raspberry Pi / Linux boards, uncomment the following:
    # privileged: true
    # devices:
    #   - /dev/gpiochip0:/dev/gpiochip0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: aura-agent-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
    name: aura-agent-backend-data
